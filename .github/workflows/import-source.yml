name: Materialize verified implementation source
on:
  push:
    branches: [feat/suha-local-phone-scanner]
    paths: [.delivery/manifest.json]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'majidsamadi/three-dimension-view'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify and unpack application source only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, pathlib, re, shutil, tarfile
          root = pathlib.Path.cwd()
          manifest = json.loads((root/'.delivery/manifest.json').read_text())
          assert manifest['format'] == 'wisestay.source.v1'
          assert 0 < len(manifest['chunks']) <= 30
          encoded = []
          for chunk in manifest['chunks']:
              assert re.fullmatch(r'payload-[0-9]{3}\.b64', chunk['file'])
              text = (root/'.delivery'/chunk['file']).read_text().strip()
              assert hashlib.sha256(text.encode()).hexdigest() == chunk['sha256'], chunk['file']
              encoded.append(text)
          compressed = base64.b64decode(''.join(encoded), validate=True)
          assert hashlib.sha256(compressed).hexdigest() == manifest['sha256']
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          unpacked = decoder.decompress(compressed, max_length=4*1024*1024)
          assert decoder.eof and not decoder.unused_data and len(unpacked) < 4*1024*1024
          with tarfile.open(fileobj=io.BytesIO(unpacked)) as archive:
              members = archive.getmembers()
              assert len(members) < 300
              for member in members:
                  p = pathlib.PurePosixPath(member.name)
                  assert member.isfile() and not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] not in ('.git', '.github', '.delivery')
                  assert p.suffix.lower() not in ('.zip','.ttf','.otf','.woff','.woff2','.docx','.w3d','.glb','.ply','.obj')
                  destination = root.joinpath(*p.parts)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(archive.extractfile(member).read())
          shutil.rmtree(root/'.delivery')
          print(f'Verified and materialized {len(members)} source files; no purchased archive, private documents, scans or font files included.')
          PY
      - name: Resolve and preserve dependency lock without running package scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Commit normal source files with a non-forced push
        env:
          DELIVERY_BRANCH: feat/suha-local-phone-scanner
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement Suha Vue SPA and local ARKit ARCore WebXR scanning'
          git push origin "HEAD:refs/heads/$DELIVERY_BRANCH"
          echo "Source materialized and lockfile committed at $(git rev-parse HEAD). Build and physical-device qualification are separate gates." >> "$GITHUB_STEP_SUMMARY"
