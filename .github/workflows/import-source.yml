name: Apply hash-verified scanner source repairs
on:
  push:
    branches: [feat/suha-local-phone-scanner]
    paths: [.delivery/manifest.json]
permissions:
  contents: write
jobs:
  materialize:
    if: github.repository == 'majidsamadi/three-dimension-view'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify exact before/after source hashes and apply the bounded patch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          manifest = json.loads((root/'.delivery/manifest.json').read_text())
          assert manifest['format'] == 'wisestay.patch.v1'
          assert 0 < len(manifest['files']) <= 100
          paths = []
          for entry in manifest['files']:
              p = pathlib.PurePosixPath(entry['path'])
              assert not p.is_absolute() and '..' not in p.parts
              assert p.parts[0] not in ('.git', '.github', '.delivery')
              assert p.suffix.lower() not in ('.zip','.ttf','.otf','.woff','.woff2','.docx','.w3d','.glb','.ply','.obj')
              file = root.joinpath(*p.parts)
              assert not file.is_symlink()
              if entry['before'] is None: assert not file.exists(), str(p)
              else: assert hashlib.sha256(file.read_bytes()).hexdigest() == entry['before'], str(p)
              paths.append(str(p))
          assert len(paths) == len(set(paths))
          encoded = (root/'.delivery/patch.b64').read_text().strip()
          assert len(encoded) < 1024*1024
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == manifest['sha256']
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          patch = decoder.decompress(compressed, max_length=4*1024*1024)
          assert decoder.eof and not decoder.unused_data and len(patch) < 4*1024*1024
          subprocess.run(['git','apply','--check','--index'], input=patch, check=True)
          subprocess.run(['git','apply','--index'], input=patch, check=True)
          changed = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().rstrip('\0').split('\0')
          assert sorted(changed) == sorted(paths), changed
          for entry in manifest['files']:
              assert hashlib.sha256((root/entry['path']).read_bytes()).hexdigest() == entry['after'], entry['path']
          shutil.rmtree(root/'.delivery')
          print(f'Applied {len(paths)} reviewed source repairs with exact before/after hashes.')
          PY
      - name: Resolve the reviewed dependency update without package scripts
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Preserve source and lockfile with a non-forced commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: repair scanner builds and model tests; update vulnerable development tooling'
          git push origin HEAD:refs/heads/feat/suha-local-phone-scanner
          echo "Hash-verified source committed at $(git rev-parse HEAD). Validation and physical qualification remain separate." >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare reproducible Linux test dependencies
        run: |
          npm ci
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' -czf verification-dependencies.tar.gz node_modules package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verification-dependencies
          path: verification-dependencies.tar.gz
          if-no-files-found: error
          retention-days: 1
